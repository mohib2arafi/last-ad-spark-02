<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arafi Technology - Income App</title>
<style>
body{font-family:Arial, sans-serif;background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);margin:0;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh;}.container{width:min(420px, 90vw);background:rgba(255,255,255,.95);border-radius:20px;padding:24px;box-shadow:0 20px 40px rgba(0,0,0,.15)}.header{text-align:center;margin-bottom:18px}.header h1{margin:0;font-size:2rem}.header p{margin:8px 0 0;color:#555}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.stat-item{background:#f4f6fb;padding:18px 12px;border-radius:14px;text-align:center}.stat-value{font-size:1.8rem;font-weight:700;color:#4f46e5}.stat-label{font-size:.9rem;color:#555;margin-top:6px}.button-group{display:flex;flex-direction:column;gap:10px}.button-group button{padding:14px 16px;border:none;border-radius:12px;cursor:pointer;font-size:1rem;font-weight:600;transition:.2s}.button-group button:disabled{cursor:not-allowed;opacity:.7}.#rewardBtn{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff}.withdraw-btn{background:#22c55e;color:#fff}.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.4)}.modal-content{background:#fff;width:min(420px,90vw);margin:15% auto;padding:22px;border-radius:16px;position:relative;box-shadow:0 18px 35px rgba(0,0,0,.2)}.close{position:absolute;right:16px;top:12px;cursor:pointer;font-size:1.8rem}.form-group{margin:14px 0}.form-group label{display:block;margin-bottom:6px;font-weight:600}.form-group input{width:100%;padding:12px 14px;border:1px solid #d1d5db;border-radius:10px;font-size:1rem;box-sizing:border-box}.info-box{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;padding:10px;border-radius:10px;margin:10px 0}.#withdrawForm button{width:100%;padding:12px;border:none;border-radius:10px;background:#111827;color:#fff;font-weight:700;cursor:pointer}.#withdrawMsg{margin-top:12px;color:#065f46;font-weight:600}</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="container">
<div class="header">
<h1>💰 Arafi Technology</h1>
<p>Income Earning Application</p>
</div>
<div class="stats">
<div class="stat-item">
<div id="earned-points" class="stat-value">0</div>
<div class="stat-label">মোট পয়েন্ট</div>
</div>
<div class="stat-item">
<div id="ads-watched" class="stat-value">0</div>
<div class="stat-label">বিজ্ঞাপন দেখা</div>
</div>
</div>
<div class="button-group">
<button id="rewardBtn" disabled>🎬 বিজ্ঞাপন দেখুন</button>
<div id="ad-status" role="status" aria-live="polite" style="font-size:.9em;color:#555;line-height:1.4;margin-top:2px"></div>
<button class="withdraw-btn" onclick="openWithdrawModal()">💳 পয়েন্ট তুলুন</button>

</div>
</div>
<div id="withdrawModal" class="modal">
<div class="modal-content">
<span class="close" onclick="closeWithdrawModal()">&times;</span>
<h2>💳 পয়েন্ট তুলুন</h2>
<form id="withdrawForm">
<div class="form-group">
<label>আপনার নাম:</label>
<input type="text" id="referName" placeholder="আপনার নাম লিখুন" required>
</div>
<div class="form-group">
<label>পয়েন্ট সংখ্যা:</label>
<input type="number" id="pointsToWithdraw" placeholder="তুলতে চান এমন পয়েন্ট" min="1" required>
</div>
<div class="info-box">
✅ আপনার অনুরোধ অ্যাডমিনের কাছে পাঠানো হবে
</div>
<button type="submit">অনুরোধ পাঠান</button>
</form>
<div id="withdrawMsg"></div>
</div>
</div>

</div>
<script>
const ADSPARK_ZONE_ID = "42"; // Zone ID পরিবর্তন করতে শুধু এই লাইনটি সম্পাদনা করুন
let adsWatched = localStorage.getItem('adsWatched') ? parseInt(localStorage.getItem('adsWatched')) : 0;
let earnedPoints = localStorage.getItem('earnedPoints') ? parseInt(localStorage.getItem('earnedPoints')) : 0;
let adReady = false;
let adLoading = false;
let isProcessing = false;
function getReferralId(){
const params = new URLSearchParams(window.location.search);
return params.get('ref') || localStorage.getItem('userId') || generateUserId();
}
function generateUserId(){
let userId = localStorage.getItem('userId');
if(!userId){
userId = 'user_' + Math.random().toString(36).substr(2, 9);
localStorage.setItem('userId', userId);
}
return userId;
}
let userId = getReferralId();
function updateStats(){
document.getElementById("earned-points").innerText = earnedPoints;
document.getElementById("ads-watched").innerText = adsWatched;
localStorage.setItem("earnedPoints", earnedPoints);
localStorage.setItem("adsWatched", adsWatched);
}
function setAdStatus(message, isError=false){
  const status = document.getElementById("ad-status");
  if (status) {
    status.textContent = message;
    status.style.color = isError ? "#dc3545" : "#555";
  }
}

// Telegram Mini App context প্রস্তুত করা
try {
  if (window.Telegram?.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }
} catch (e) {
  console.warn("Telegram WebApp init:", e);
}

function loadAdScript(){
  const btn = document.getElementById("rewardBtn");
  btn.disabled = true;
  btn.innerText = "⏳ বিজ্ঞাপন প্রস্তুত হচ্ছে...";
  setAdStatus("AdSpark SDK লোড হচ্ছে...");

  // Prevent duplicate SDK loading if the page is initialized more than once.
  if (typeof window.showAdspark === "function") {
    prepareAdSdk();
    return;
  }

  const script = document.createElement("script");
  script.src = "https://adspark-tma.top/api/public/sdk.js?k=" + encodeURIComponent(ADSPARK_ZONE_ID);
  script.async = true;
  script.onload = prepareAdSdk;
  script.onerror = () => {
    adReady = false;
    btn.disabled = false;
    btn.innerText = "🔄 আবার চেষ্টা করুন";
    setAdStatus("AdSpark SDK লোড হয়নি। ইন্টারনেট/Zone ID যাচাই করে আবার চেষ্টা করুন।", true);
  };
  document.head.appendChild(script);
}

async function prepareAdSdk(){
  const btn = document.getElementById("rewardBtn");
  if (typeof window.showAdspark !== "function") {
    adReady = false;
    btn.disabled = false;
    btn.innerText = "🔄 আবার চেষ্টা করুন";
    setAdStatus("SDK লোড হয়েছে, কিন্তু showAdspark ফাংশন পাওয়া যায়নি। AdSpark-এর দেওয়া SDK URL ও Zone ID যাচাই করুন।", true);
    return;
  }

  // AdSpark documentation supplied by the user says this optional warm-up can make ads instant.
  try {
    if (window.AdSpark && typeof window.AdSpark.ready === "function") {
      await window.AdSpark.ready();
    }
  } catch (e) {
    console.warn("AdSpark warm-up failed:", e);
    // Still allow the show call; warm-up is optional.
  }

  adReady = true;
  btn.disabled = false;
  btn.innerText = "🎬 বিজ্ঞাপন দেখুন";
  setAdStatus("প্রস্তুত। বিজ্ঞাপন না এলে কিছুক্ষণ পর আবার চেষ্টা করুন।");
}

loadAdScript();

document.getElementById("rewardBtn").onclick = async function(){
  if (adLoading) return;
  if (!adReady || typeof window.showAdspark !== "function") {
    setAdStatus("বিজ্ঞাপন SDK প্রস্তুত নয়। আবার চেষ্টা করুন।", true);
    loadAdScript();
    return;
  }

  // Rewarded ads require a real Telegram Mini App user ID as in the supplied AdSpark example.
  const telegramUserId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
  if (!telegramUserId) {
    setAdStatus("Telegram Mini App-এর ভিতরে বটের Open App/Start বাটন দিয়ে খুলুন। সরাসরি Vercel লিংক খুললে Telegram user ID পাওয়া যাবে না।", true);
    return;
  }

  const btn = this;
  btn.disabled = true;
  adLoading = true;
  btn.innerText = "⏳ বিজ্ঞাপন লোড হচ্ছে...";
  setAdStatus("বিজ্ঞাপনের অনুরোধ পাঠানো হয়েছে...");

  try {
    await window.showAdspark({ ymid: telegramUserId });

    // Only grant the point when the rewarded-ad Promise resolves successfully.
    adsWatched++;
    earnedPoints += 1;
    updateStats();
    btn.innerText = "🎬 বিজ্ঞাপন দেখুন";
    setAdStatus("বিজ্ঞাপন সম্পন্ন হয়েছে! ১ পয়েন্ট যোগ হয়েছে।");
  } catch(e) {
    console.error("AdSpark বিজ্ঞাপন ত্রুটি:", e);
    btn.innerText = "🎬 আবার বিজ্ঞাপন দেখুন";
    setAdStatus("এখন বিজ্ঞাপন পাওয়া যায়নি বা SDK অনুরোধ ব্যর্থ হয়েছে। AdSpark-এ Zone ID 40 সক্রিয় আছে কিনা দেখে নিন।", true);
  } finally {
    adLoading = false;
    btn.disabled = false;
  }
};

const withdrawModal = document.getElementById('withdrawModal');
function openWithdrawModal(){ withdrawModal.style.display='block'; }
function closeWithdrawModal(){ withdrawModal.style.display='none'; }
const referralModal = document.getElementById('referralModal');
window.onclick = function(e){
if(e.target == withdrawModal) closeWithdrawModal();

}
document.getElementById('withdrawForm').addEventListener('submit', function(e){
 e.preventDefault();
 if(isProcessing){ 
 alert("⏳ অপেক্ষা করুন..."); 
 return; 
 }
 const referName = document.getElementById('referName').value.trim();
 const points = parseInt(document.getElementById('pointsToWithdraw').value);
 if(!referName){
 alert("❌ আপনার নাম লিখুন!");
 return;
 }
 if(points > earnedPoints || points <= 0){
 alert("❌ অবৈধ পরিমাণ! আপনার কাছে " + earnedPoints + " পয়েন্ট আছে");
 return;
 }
 if(points < 10){
 alert("❌ সর্বনিম্ন ১০ পয়েন্ট তুলতে হবে!");
 return;
 }
 isProcessing = true;
 earnedPoints -= points;
 updateStats();
 closeWithdrawModal();
 const now = new Date();
 const date = now.toLocaleDateString("en-US",{timeZone:"Asia/Dhaka"});
 const time = now.toLocaleTimeString("en-US",{timeZone:"Asia/Dhaka"});
 sendTelegram(referName, points, date, time, userId);
 document.getElementById('withdrawForm').reset();
 setTimeout(()=>{
 alert("✅ অনুরোধ সফলভাবে পাঠানো হয়েছে!");
 isProcessing = false;
 }, 1000);
});
function sendTelegram(referName, points, date, time, userId){
const botToken = "8836582797:AAF4uUxbdq4KFeP18cx3TIgOAzQklNsSEXw"; // Do not put a real bot token in public frontend code
const adminChatId = "1926751288";
const message = `🚀 <b>নতুন উত্তোলন অনুরোধ</b>\n\n👤 <b>নাম:</b> ${referName}\n💰 <b>পয়েন্ট:</b> ${points}\n📅 <b>তারিখ:</b> ${date}\n🕒 <b>সময়:</b> ${time}\n🆔 <b>User ID:</b> ${userId}`;
fetch(`https://api.telegram.org/bot${botToken}/sendMessage`,{
 method:"POST",
 headers:{"Content-Type":"application/json"},
 body:JSON.stringify({
 chat_id:adminChatId,
 text:message,
 parse_mode:"HTML"
 })
}).catch(err => console.error("টেলিগ্রাম ত্রুটি:", err));
}
updateStats();
</script>
</body>
</html>
